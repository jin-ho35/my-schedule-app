<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
      content="width=device-width, initial-scale=1.0">
  <title>予定開始</title>

  <style>
  body {
    font-family: sans-serif;
    padding: 16px;
    max-width: 480px;
    margin: auto;
    text-align: center;
  }

  #taskBox {
    font-size: 22px;
    margin: 24px 0;
  }

  .btnRow {
    display: flex;
    justify-content: space-between;
    margin-top: 24px;
  }

  /* ★ スマホ向けボタン */
  .btnRow button {
    width: 140px;
    height: 48px;      /* スマホ向け */
    font-size: 18px;
    border-radius: 8px;
    border: 1px solid #0078D4;
    background-color: #f0f0f0;
    cursor: pointer;
  }

  .btnRow button:hover {
    background-color: #e0e0e0;
  }

  .taskItem{
  background:#eef6ff;
  border:1px solid #93c5fd;
  border-radius:10px;
  padding:5px;
  margin:10px 0;
  font-size:24px;
  cursor:pointer;
}

.taskItem.done{
  background:#dcdcdc;
  color:#666;
}

@media (max-width: 600px) {

  .taskItem{
    font-size: 25px;
    padding: 5px 10px;
  }

}

#progressBox{
  font-size:20px;
  font-weight:bold;
  margin:10px 0 20px 0;
  color:#3567b7;
}

.viewButtons {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}

.viewButtons button {
  flex: 1;
  height: 56px;
  font-size: 20px;
}

.dateNav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}

.dateNav h2 {
  margin: 0;
}

.dateNav button {
  width: 44px;
  height: 40px;
  margin: 0;
  padding: 0;
  font-size: 26px;
}
</style>


</head>
<body>

  <h1>予定開始</h1>

 <div class="dateNav">
  <button type="button" onclick="changeDate(-1)">‹</button>
  <h2 id="viewDate"></h2>
  <button type="button" onclick="changeDate(1)">›</button>
</div>

<div id="progressBox"></div>

<div id="taskList"></div>

<div class="viewButtons">
  <button onclick="goToInput()">予定追加</button>
  <button onclick="goToCalendar()">カレンダー</button>
</div>


  <script>
    // 選択された日付
    const selectedDate = localStorage.getItem("selectedDate");
    document.getElementById("viewDate").textContent = selectedDate;

    // 日付ごとの予定
    const allTasks = JSON.parse(localStorage.getItem("allTasks")) || {};

    // ★ この日付の予定だけを使う（ここが重要）
    
const allDayTasks = allTasks[selectedDate] || [];

const tasks =
  allDayTasks.filter(task => task.time);

    function goToInput() {
      window.location.href = "index.html";
    }

    function goToCalendar() {
      window.location.href = "calendar.html";
    }

// 今日の予定を表示
const taskList = document.getElementById("taskList");

// 保存済み達成状態
const doneKey = "doneTasks_" + selectedDate;
let doneTasks = JSON.parse(localStorage.getItem(doneKey)) || [];

function updateProgress() {

  document.getElementById("progressBox").textContent =
    `達成率 ${doneTasks.length} / ${tasks.length}`;

}

tasks.forEach((task, index) => {

  const card = document.createElement("div");
  card.className = "taskItem";

  // 達成済みなら色変更
  if (doneTasks.includes(index)) {
    card.classList.add("done");
  }

  card.textContent = `${task.time} - ${task.name}`;

  card.onclick = () => {

    card.classList.toggle("done");

    if (card.classList.contains("done")) {

      if (!doneTasks.includes(index)) {
        doneTasks.push(index);
      }

    } else {

      doneTasks = doneTasks.filter(i => i !== index);

    }

    localStorage.setItem(
      doneKey,
      JSON.stringify(doneTasks)
    );
    updateProgress();
  };

  taskList.appendChild(card);
  updateProgress();
});

function changeDate(offset) {
  const current = localStorage.getItem("selectedDate");
  if (!current) return;

  const [year, month, day] = current.split("-").map(Number);
  const date = new Date(year, month - 1, day);
  date.setDate(date.getDate() + offset);

  const newDate = [
    date.getFullYear(),
    String(date.getMonth() + 1).padStart(2, "0"),
    String(date.getDate()).padStart(2, "0")
  ].join("-");

  localStorage.setItem("selectedDate", newDate);
  location.reload();
}
  </script>

</body>
</html>
