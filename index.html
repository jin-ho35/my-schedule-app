<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>タスク入力ページ</title>

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

  <style>
 body {
  font-family: sans-serif;
  padding: 16px;
  max-width: 480px;
  margin: auto;
}

h2 {
  font-size: 20px;
  margin-top: 24px;
}

/* 共通ボタン */
button {
  width: 100%;
  max-width: 300px;
  height: 48px;
  margin: 8px 0;
  border: 1px solid #0078D4;
  border-radius: 8px;
  background-color: #f0f0f0;
  font-size: 18px;
  text-align: center;
  cursor: pointer;
}

/* 入力欄 */
input {
  width: 100%;
  max-width: 300px;
  height: 40px;
  margin: 8px 0;
  padding: 6px;
  font-size: 18px;
}

.inputRow {
  display: flex;
  gap: 8px;
}

.timeInputWrap {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 4px;
}

.timeInputWrap span {
  font-size: 20px;
}

#timeInput {
  width: 70px;
  margin: 8px 0;
}

#taskInput {
  flex: 1;
}

/* 予定・リストのカード */
#previewList {
  margin-top: 15px;
}

.previewContainer {
  display: block;
  margin-top: 15px;
}

.previewSection {
  margin-bottom: 20px;
}

.previewItem {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 3px 0;
  padding: 2px 12px;
  border-radius: 8px;
  font-size: 22px;
  text-align: left;
}

.scheduleCard {
  border: 1px solid #93c5fd;
  background: #dbeafe;
}

.taskCard {
  border: 1px solid #fcd34d;
  background: #fef3c7;
}

/* 重要な予定カード */
.importantCard {
  border: 1px solid #fca5a5;
  background: #F8DADA;
}

/* 入力中プレビュー */
#draftPreview {
  margin-top: 10px;
}

/* カード内の「削除」ボタン */
.previewItem button {
  width: auto;
  max-width: none;
  height: auto;
  margin: 0 0 0 8px;
  padding: 4px 8px;
  border: 1px solid #0078D4;
  border-radius: 6px;
  background: #f0f0f0;
  color: #333;
  font-size: 14px;
}

/* 見出し横のボタン */
.sectionHeader {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.sectionHeader h3 {
  margin: 0;
}

.sectionHeader button {
  width: 120px;
  max-width: none;
  height: 40px;
  margin: 0;
  padding: 0 10px;
  font-size: 16px;
}

/* 過去タスク欄 */
#dropdownHeader {
  display: block;
  width: 100%;
  max-width: 300px;
  margin: 8px 0;
  text-align: left;
}

#pastTaskList li {
  font-size: 18px;
}

#pastTaskList button {
  width: auto;
  max-width: none;
  height: auto;
  margin: 0 0 0 10px;
  padding: 3px 8px;
  font-size: 14px;
}

/* ページ中央寄せ */
.contentArea {
  max-width: 420px;
  margin: 0 auto;
}

.contentArea > h1 {
  text-align: center;
}

.contentArea > button {
  display: block;
  margin: 8px auto;
}

#dropdownBox {
  margin-right: auto !important;
  margin-left: auto !important;
}

/* カレンダーへ戻るボタン */
button#backToCalendarBtn {
  display: block;
  margin-right: auto;
  margin-left: auto;
  padding: 10px 20px;
  font-size: 18px;
}

@media (max-width: 600px) {
  .previewItem {
    padding-top: 0;
    padding-bottom: 0;
    font-size: 18px;
  }

  .previewItem button {
    padding: 3px 6px;
    font-size: 12px;
  }
}

@media (max-width: 600px) {
  /* 時刻欄とタスク入力欄 */
  .inputRow input {
    height: 34px;
    padding: 5px;
    font-size: 16px;
  }

  #timeInput {
    width: 64px;
  }

  #taskInput {
    min-width: 0;
  }

  /* 追加ボタン */
  .contentArea > button {
    height: 38px;
    margin: 6px auto;
    font-size: 16px;
  }

  /* 履歴の選択欄 */
  #dropdownBox {
    padding: 5px;
  }

  #dropdownHeader {
    margin: 4px 0;
    font-size: 16px;
  }

  #pastTaskList li {
    margin: 4px 0 !important;
    font-size: 16px;
  }
}

@media (max-width: 600px) {
  body {
    padding-left: 24px;
    padding-right: 24px;
  }
}
.dateNav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

.dateNav h1 {
  margin: 0;
  font-size: 24px;
  white-space: nowrap;
}

.dateNav button {
  flex: 0 0 44px;
  width: 44px;
  height: 40px;
  margin: 0;
  padding: 0;
  font-size: 26px;
}

.done {
  background-color: #ddd !important;
  color: #888 !important;
  text-decoration: line-through;
}
</style>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="./icon.png">

</head>
<body>
<div class="dateNav">
  <button type="button" onclick="changeDate(-1)">‹</button>
  <h2 id="selectedDateDisplay"></h2>
  <button type="button" onclick="changeDate(1)">›</button>
</div>

<div class="contentArea">
<h1>予定を作る</h1>
</div>

<!-- 入力・履歴の収納 -->
<div style="margin:10px 0; text-align:left;">

  <button type="button" onclick="toggleTaskInputArea()">
    ▼ 予定を入力・編集
  </button>

</div>

<div id="taskInputArea">

<div class="inputRow">

  <div class="timeInputWrap">
    <span aria-hidden="true">🕒</span>
    <input id="timeInput" type="time" aria-label="時刻">
  </div>

  <input id="taskInput" placeholder="タスク名">

</div>

<!-- 重要な予定のチェック -->
<div style="margin: 5px 0 12px; text-align: left;">
  <label style="display: inline-flex; align-items: center; gap: 6px;">
    <input
      type="checkbox"
      id="importantInput"
      style="width: auto; height: auto; margin: 0;"
    >
    重要な予定（赤色で表示）
  </label>
</div>

<!-- 次の7日間の予定設定 -->
<div style="margin: 10px 0 12px; text-align: left;">

  <button type="button" onclick="toggleRepeatDays()">
    ▼ 次の7日間に設定
  </button>

  <div id="repeatDays" style="display:none; margin-top:10px;">

    <div id="repeatDayLabels"
         style="display:flex; justify-content:space-between; gap:4px;">
    </div>

    <div id="repeatDayChecks"
         style="display:flex; justify-content:space-between; gap:4px;">
    </div>

  </div>

</div>

<button onclick="addTask()">追加</button>

<!-- 入力中のプレビューカード -->
<div
  id="draftPreview"
  class="previewItem"
  style="display: none;"
></div>

<!-- ★ ドロップダウンボックス（普段は閉じている） -->

<div id="dropdownBox" style="
  border: 1px solid #ccc;
  padding: 10px;
  border-radius: 6px;
  max-width: 400px;
  margin: 0;                /* ★ 左寄せに変更 */
  background-color: #f9f9f9;
">


  <div id="dropdownHeader"
       style="cursor:pointer; color:#666;">
    ▼ 履歴
  </div>

  <!-- ★ 最初は非表示 -->
  <ul id="pastTaskList"
      style="list-style:none; padding-left:0; display:none;"></ul>
</div>

</div>

<hr>

<div class="previewSection">
  <div class="sectionHeader">
    <h3>予定</h3>
    <button onclick="startView()">予定開始</button>
  </div>
  <div id="previewList"></div>
</div>

<hr class="sectionDivider">

<div class="previewSection">
  <div class="sectionHeader">

    <h3>リスト</h3>
    <button onclick="goToChecklist()">リスト表示</button>
  </div>
  <div id="freeTaskList"></div>
</div>

<!-- ★ 非表示のセレクト（JSが参照するためだけに必要） -->
<select id="pastTaskSelect" style="display:none;"></select>



<script src="app.js"></script>

<div style="text-align:left; margin-top:20px;">
  <button id="backToCalendarBtn"
          onclick="window.location.href='calendar.html'">
    カレンダーへ戻る
  </button>
</div>
</div>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
  }

  function changeDate(offset) {
  const current = localStorage.getItem("selectedDate");
  if (!current) return;

  const [year, month, day] = current.split("-").map(Number);
  const date = new Date(year, month - 1, day);
  date.setDate(date.getDate() + offset);

  const newDate = [
    date.getFullYear(),
    String(date.getMonth() + 1).padStart(2, "0"),
    String(date.getDate()).padStart(2, "0")
  ].join("-");

  localStorage.setItem("selectedDate", newDate);
  location.reload();
}

// 次の7日間の曜日・日付を表示
function toggleRepeatDays() {

  const area = document.getElementById("repeatDays");

  if (area.style.display === "none") {
    area.style.display = "block";
    createRepeatDays();
  } else {
    area.style.display = "none";
  }
}

function createRepeatDays() {

  const labels = document.getElementById("repeatDayLabels");
  const checks = document.getElementById("repeatDayChecks");

  labels.innerHTML = "";
  checks.innerHTML = "";

  const today = new Date(localStorage.getItem("selectedDate"));

  const weekdays = ["日", "月", "火", "水", "木", "金", "土"];

  for (let i = 0; i < 7; i++) {

    const date = new Date(today);
    date.setDate(today.getDate() + i);

    const day = date.getDay();

    // 日付
    const dateText =
      date.getFullYear() + "-" +
      String(date.getMonth() + 1).padStart(2, "0") + "-" +
      String(date.getDate()).padStart(2, "0");

    // 1日分の選択ボタン
    const dayButton = document.createElement("button");
    dayButton.type = "button";
    dayButton.dataset.date = dateText;

    dayButton.innerHTML =
      weekdays[day] + "<br>" +
      date.getDate();

    dayButton.style.flex = "1";
    dayButton.style.padding = "8px 2px";
    dayButton.style.margin = "0 2px";
    dayButton.style.border = "1px solid #ccc";
    dayButton.style.borderRadius = "8px";
    dayButton.style.background = "#fff";
    dayButton.style.cursor = "pointer";
    dayButton.style.fontSize = "13px";
    dayButton.style.lineHeight = "1.4";

    // タップで選択・解除
    dayButton.onclick = () => {

      dayButton.classList.toggle("selected");

      if (dayButton.classList.contains("selected")) {
        dayButton.style.background = "#0078D4";
        dayButton.style.color = "white";
      } else {
        dayButton.style.background = "#fff";
        dayButton.style.color = "black";
      }
    };

    checks.appendChild(dayButton);
  }
}

</script>
</body>
</html>
