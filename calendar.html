<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カレンダー</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }

    #calendarContainer {
      max-width: 400px;
      margin: 0 auto;
      padding: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background-color: #f0f0f0;
      padding: 8px;
      font-size: 16px;
    }

    td {
      width: 14%;
      height: 55px;
      border: 1px solid #ccc;
      cursor: pointer;
      text-align: center;
      color: black;
      font-size: 16px;
    }

    /* 通常の予定がある日 */
    .hasTask {
      background-color: #FFEB99;
      color: black;
      border-radius: 6px;
    }

    /* 重要な予定がある日 */
    .highTask {
      background-color: #FF6666;
      color: black;
      font-weight: bold;
      border-radius: 6px;
    }

    /* 今日 */
    .today {
      border: 3px solid black;
      font-weight: bold;
      border-radius: 6px;
      color: black;
    }

    .navBtn {
      font-size: 20px;
      cursor: pointer;
      padding: 8px 12px;
    }

    /* 月カード：4列×3行 */
    #monthGrid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      max-width: 400px;
      margin: 16px auto;
    }

    .monthCard {
      min-height: 48px;
      padding: 8px;
      border: 1px solid #93c5fd;
      border-radius: 8px;
      background: #eef6ff;
      font-size: 16px;
      cursor: pointer;
    }

    .monthCard.active {
      background: #dbeafe;
      border: 2px solid #3b82f6;
      font-weight: bold;
    }

    .monthCard:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 2px;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      td {
        height: 60px;
        font-size: 18px;
      }

      th {
        font-size: 18px;
      }

      .navBtn {
        font-size: 18px;
        padding: 10px 14px;
      }

      .monthCard {
        min-height: 44px;
        padding: 6px;
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <h1 id="monthTitle"></h1>

  <div>
    <span class="navBtn" onclick="prevMonth()">← 前の月</span>
    <span class="navBtn" onclick="nextMonth()">次の月 →</span>
  </div>

  <br>

  <div id="calendarContainer">
    <table id="calendar"></table>
  </div>

  <!-- 1月から12月の月カード -->
  <div id="monthGrid"></div>

  <script>
    // 全ての予定データ
    const allTasks = JSON.parse(localStorage.getItem("allTasks")) || {};

    // 現在表示中の年月
    let current = new Date();

    // 月カードを作成
    function createMonthCards() {
      const monthGrid = document.getElementById("monthGrid");

      for (let month = 0; month < 12; month++) {
        const card = document.createElement("button");

        card.type = "button";
        card.className = "monthCard";
        card.textContent = `${month + 1}月`;
        card.setAttribute("aria-label", `${month + 1}月を表示`);

        card.onclick = () => {
          current = new Date(current.getFullYear(), month, 1);
          generateCalendar(current.getFullYear(), current.getMonth());

          document.getElementById("monthTitle").scrollIntoView({
            behavior: "smooth",
            block: "start"
          });
        };

        monthGrid.appendChild(card);
      }
    }

    // カレンダーを作成
    function generateCalendar(year, month) {
      const calendar = document.getElementById("calendar");
      const monthTitle = document.getElementById("monthTitle");

      calendar.innerHTML = "";
      monthTitle.textContent = `${year}年 ${month + 1}月`;

      // 表示中の月カードを強調
      document.querySelectorAll(".monthCard").forEach((card, index) => {
        card.classList.toggle("active", index === month);
      });

      // 曜日行
      const days = ["日", "月", "火", "水", "木", "金", "土"];
      const headerRow = document.createElement("tr");

      days.forEach(day => {
        const th = document.createElement("th");
        th.textContent = day;
        headerRow.appendChild(th);
      });

      calendar.appendChild(headerRow);

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      let row = document.createElement("tr");

      // 月初より前の空白セル
      for (let i = 0; i < firstDay; i++) {
        row.appendChild(document.createElement("td"));
      }

      // 日付セル
      for (let date = 1; date <= lastDate; date++) {
        const cell = document.createElement("td");
        cell.textContent = date;

        const dateStr =
          `${year}-${String(month + 1).padStart(2, "0")}-${String(date).padStart(2, "0")}`;

        // 今日を強調
        const now = new Date();
        const isToday =
          year === now.getFullYear() &&
          month === now.getMonth() &&
          date === now.getDate();

        if (isToday) {
          cell.classList.add("today");
        }

        // 予定がある日を色分け
        const tasks = allTasks[dateStr] || [];

        if (tasks.length > 0) {
          if (tasks.some(task => task.importance === "high")) {
            cell.classList.add("highTask");
          } else {
            cell.classList.add("hasTask");
          }
        }

        // 日付を選ぶ
        cell.onclick = () => {
          localStorage.setItem("selectedDate", dateStr);
          window.location.href = "index.html";
        };

        row.appendChild(cell);

        // 土曜日で週を区切る
        if ((firstDay + date) % 7 === 0) {
          calendar.appendChild(row);
          row = document.createElement("tr");
        }
      }

      calendar.appendChild(row);
    }

    // 前の月へ
    function prevMonth() {
      current = new Date(
        current.getFullYear(),
        current.getMonth() - 1,
        1
      );

      generateCalendar(current.getFullYear(), current.getMonth());
    }

    // 次の月へ
    function nextMonth() {
      current = new Date(
        current.getFullYear(),
        current.getMonth() + 1,
        1
      );

      generateCalendar(current.getFullYear(), current.getMonth());
    }

    // 初期表示
    createMonthCards();
    generateCalendar(current.getFullYear(), current.getMonth());
  </script>

</body>
</html>
