<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カレンダー</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }

    #calendarContainer {
      max-width: 400px;
      margin: 0 auto;
      padding: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background-color: #f0f0f0;
      padding: 8px;
      font-size: 16px;
    }

    td {
      width: 14%;
      height: 55px;
      border: 1px solid #ccc;
      cursor: pointer;
      text-align: center;
      color: black;
      font-size: 16px;
    }

    /* 時刻ありの予定：薄い青 */
.hasTimedTask {
  background-color: #DCEEFF;
  color: black;
  border-radius: 6px;
}

/* 時刻なしの予定：薄い黄色 */
.hasUntimedTask {
  background-color: #FFEB99;
  color: black;
  border-radius: 6px;
}

/* 両方の予定がある日：青と黄色の半分ずつ */
.hasBothTasks {
  background: linear-gradient(
    to right,
    #DCEEFF 50%,
    #FFEB99 50%
  );
  color: black;
  border-radius: 6px;
}

    /* 重要な予定がある日 */
    .highTask {
      background-color: #FF6666;
      color: black;
      font-weight: bold;
      border-radius: 6px;
    }

    /* 今日 */
    .today {
      border: 3px solid black;
      font-weight: bold;
      border-radius: 6px;
      color: black;
    }

    .navBtn {
      font-size: 20px;
      cursor: pointer;
      padding: 8px 12px;
    }

    /* 月カード：4列×3行 */
    #monthGrid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      max-width: 400px;
      margin: 16px auto;
    }

    .monthCard {
      min-height: 48px;
      padding: 8px;
      border: 1px solid #93c5fd;
      border-radius: 8px;
      background: #eef6ff;
      font-size: 16px;
      cursor: pointer;
    }

    .monthCard.active {
      background: #dbeafe;
      border: 2px solid #3b82f6;
      font-weight: bold;
    }

    .monthCard:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 2px;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      td {
        height: 60px;
        font-size: 18px;
      }

      th {
        font-size: 18px;
      }

      .navBtn {
        font-size: 18px;
        padding: 10px 14px;
      }

      .monthCard {
        min-height: 44px;
        padding: 6px;
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <h1 id="monthTitle"></h1>

  <div>
    <span class="navBtn" onclick="prevMonth()">← 前の月</span>
    <span class="navBtn" onclick="nextMonth()">次の月 →</span>
  </div>

  <br>

  <div id="calendarContainer">
    <table id="calendar"></table>
  </div>

  <!-- 1月から12月の月カード -->
  <div id="monthGrid"></div>

  <!-- データ管理 -->
  <hr style="margin-top:30px;">

  <div id="dataManagement" style="
    max-width:400px;
    margin:20px auto;
    padding:15px;
    border:1px solid #ccc;
    border-radius:10px;
  ">

    <h3>データ管理</h3>

    <p style="font-size:14px; color:#666;">
      予定やタスクのデータを保存・復元できます。
    </p>

    <button type="button" onclick="backupData()">
      データをバックアップ
    </button>

    <button type="button" onclick="selectBackupFile()">
      データを復元
    </button>

    <input
      type="file"
      id="backupFile"
      accept=".json,application/json"
      style="display:none;"
    >

  </div>

  <script>
    // 全ての予定データ
    const allTasks = JSON.parse(localStorage.getItem("allTasks")) || {};

    // 現在表示中の年月
    let current = new Date();

    // 月カードを作成
    function createMonthCards() {
      const monthGrid = document.getElementById("monthGrid");

      for (let month = 0; month < 12; month++) {
        const card = document.createElement("button");

        card.type = "button";
        card.className = "monthCard";
        card.textContent = `${month + 1}月`;
        card.setAttribute("aria-label", `${month + 1}月を表示`);

        card.onclick = () => {
          current = new Date(current.getFullYear(), month, 1);
          generateCalendar(current.getFullYear(), current.getMonth());

          document.getElementById("monthTitle").scrollIntoView({
            behavior: "smooth",
            block: "start"
          });
        };

        monthGrid.appendChild(card);
      }
    }

    // カレンダーを作成
    function generateCalendar(year, month) {
      const calendar = document.getElementById("calendar");
      const monthTitle = document.getElementById("monthTitle");

      calendar.innerHTML = "";
      monthTitle.textContent = `${year}年 ${month + 1}月`;

      // 表示中の月カードを強調
      document.querySelectorAll(".monthCard").forEach((card, index) => {
        card.classList.toggle("active", index === month);
      });

      // 曜日行
      const days = ["日", "月", "火", "水", "木", "金", "土"];
      const headerRow = document.createElement("tr");

      days.forEach(day => {
        const th = document.createElement("th");
        th.textContent = day;
        headerRow.appendChild(th);
      });

      calendar.appendChild(headerRow);

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      let row = document.createElement("tr");

      // 月初より前の空白セル
      for (let i = 0; i < firstDay; i++) {
        row.appendChild(document.createElement("td"));
      }

      // 日付セル
      for (let date = 1; date <= lastDate; date++) {
        const cell = document.createElement("td");
        cell.textContent = date;

        const dateStr =
          `${year}-${String(month + 1).padStart(2, "0")}-${String(date).padStart(2, "0")}`;

        // 今日を強調
        const now = new Date();
        const isToday =
          year === now.getFullYear() &&
          month === now.getMonth() &&
          date === now.getDate();

        if (isToday) {
          cell.classList.add("today");
        }

        // 予定がある日を色分け

// 予定がある日を色分け
const tasks = allTasks[dateStr] || [];

if (tasks.length > 0) {

  // それぞれの種類が含まれているか確認
  const hasTimedTasks = tasks.some(task => !!task.time);

  const hasUntimedTasks = tasks.some(task => !task.time);

  const hasImportantTasks = tasks.some(
    task => task.important === true || task.importance === "high"
  );

  // 該当する色を集める
  const colors = [];

  if (hasTimedTasks) {
    colors.push("#DCEEFF"); // 薄い青
  }

  if (hasUntimedTasks) {
    colors.push("#FFEB99"); // 薄い黄色
  }

  if (hasImportantTasks) {
    colors.push("#F8DADA"); // 薄い赤
  }

  // 色が1種類なら単色、複数なら均等なグラデーション
  if (colors.length === 1) {

    cell.style.background = colors[0];

  } else if (colors.length > 1) {

    const stops = colors.map((color, index) => {
      const start = (index / colors.length) * 100;
      const end = ((index + 1) / colors.length) * 100;

      return `${color} ${start}% ${end}%`;
    });

    cell.style.background =
      `linear-gradient(to right, ${stops.join(", ")})`;
  }
}

        // 日付を選ぶ
        cell.onclick = () => {
          localStorage.setItem("selectedDate", dateStr);
          window.location.href = "index.html";
        };

        row.appendChild(cell);

        // 土曜日で週を区切る
        if ((firstDay + date) % 7 === 0) {
          calendar.appendChild(row);
          row = document.createElement("tr");
        }
      }

      calendar.appendChild(row);
    }

    // 前の月へ
    function prevMonth() {
      current = new Date(
        current.getFullYear(),
        current.getMonth() - 1,
        1
      );

      generateCalendar(current.getFullYear(), current.getMonth());
    }

    // 次の月へ
    function nextMonth() {
      current = new Date(
        current.getFullYear(),
        current.getMonth() + 1,
        1
      );

      generateCalendar(current.getFullYear(), current.getMonth());
    }


// ==============================
// データのバックアップ
// ==============================
function backupData() {

  const backupContents = {
    version: 1,
    createdAt: new Date().toISOString(),
    allTasks: JSON.parse(localStorage.getItem("allTasks")) || {},
    pastTasks: JSON.parse(localStorage.getItem("pastTasks")) || []
  };

  const json = JSON.stringify(backupContents, null, 2);

  const blob = new Blob(
    [json],
    { type: "application/json" }
  );

  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");
  link.href = url;
  link.download = "task-backup.json";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  URL.revokeObjectURL(url);

  alert("バックアップデータを作成しました。");
}


// ==============================
// 復元するファイルを選択
// ==============================
function selectBackupFile() {
  document.getElementById("backupFile").click();
}


// ==============================
// バックアップファイルの読み込み
// ==============================
document.getElementById("backupFile").addEventListener("change", function(event) {

  const file = event.target.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function() {

    try {

      const backup = JSON.parse(reader.result);

      // データ形式を確認
      if (
        !backup ||
        typeof backup.allTasks !== "object" ||
        backup.allTasks === null ||
        Array.isArray(backup.allTasks) ||
        !backup.pastTasks ||
        !Array.isArray(backup.pastTasks)
      ) {
        alert("このファイルは正しいバックアップデータではありません。");
        return;
      }

      // 日付ごとの予定データを確認
      const validTasks = Object.values(backup.allTasks).every(dayTasks =>
        Array.isArray(dayTasks) &&
        dayTasks.every(task =>
          task && typeof task === "object" && !Array.isArray(task)
        )
      );

      if (!validTasks) {
        alert("予定データの形式が正しくありません。");
        return;
      }

      // 復元前の確認
      const confirmed = confirm(
        "現在保存されている予定データを上書きして復元します。\nよろしいですか？"
      );

      if (!confirmed) return;

      // データを復元
      localStorage.setItem(
        "allTasks",
        JSON.stringify(backup.allTasks)
      );

      localStorage.setItem(
        "pastTasks",
        JSON.stringify(backup.pastTasks)
      );

      alert("データを復元しました。");

      // 画面を更新
      location.reload();

    } catch (error) {

      alert("ファイルを読み込めませんでした。");

    }
  };

  reader.readAsText(file);

  // 同じファイルを再度選択できるようにする
  event.target.value = "";

});

    // 初期表示
    createMonthCards();
    generateCalendar(current.getFullYear(), current.getMonth());
  </script>

</body>
</html>
